      <script>
        (function () {
          // mascote (blocos de 8 px); olhos guardados pra piscar
          var MASCOT = ["..BBBBBBBB..", "..BBBBBBBB..", "..BEBBBBEB..", "BBBEBBBBEBBB", "BBBBBBBBBBBB", "..BBBBBBBB..", "..B.B..B.B..", "..B.B..B.B.."];
          var host = document.getElementById("c07-mascot"), eyes = [];
          for (var r = 0; r < 8; r++) for (var c = 0; c < 12; c++) {
            var ch = MASCOT[r][c]; if (ch === ".") continue;
            var p = document.createElement("div"); p.className = "c07-px";
            p.style.left = c * 8 + "px"; p.style.top = r * 8 + "px"; p.style.width = "8px"; p.style.height = "8px";
            p.style.background = ch === "E" ? "#1a1a1a" : "#d97757"; host.appendChild(p);
            if (ch === "E" && r === 2) eyes.push(p);
          }

          gsap.set(["#c07-l1", "#c07-l2", "#c07-l3"], { opacity: 0 });
          var tl = gsap.timeline({ paused: true });
          // "Claude" (0,08): o mascote pisca e dá um pulinho
          eyes.forEach(function (e) { tl.set(e, { backgroundColor: "#d97757" }, 0.08); tl.set(e, { backgroundColor: "#1a1a1a" }, 0.2); });
          tl.to("#c07-mascot", { y: -10, duration: 0.08, ease: "power2.out" }, 0.08);
          tl.to("#c07-mascot", { y: 0, duration: 0.1, ease: "power2.in" }, 0.16);
          // 0,30: "Pensando…"
          tl.fromTo("#c07-l1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, 0.3);
          var dots = [".", "..", "…"];
          for (var d = 0; d < 3; d++) tl.set("#c07-dots", { textContent: dots[d] }, 0.36 + d * 0.07);
          // "Code" (0,60): procurando a TV na rede Wi-Fi + ondas do Wi-Fi acendendo
          tl.set("#c07-l1t", { textContent: "Procurando a TV na rede Wi-Fi" }, 0.6);
          tl.set("#c07-dots", { textContent: "…" }, 0.6);
          tl.fromTo("#c07-l1", { x: -6 }, { x: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, 0.6);
          for (var b = 0; b < 4; b++) tl.set("#c07-b1", { opacity: b % 2 ? 1 : 0.35 }, 0.62 + b * 0.07);
          ["#c07-w0", "#c07-w1", "#c07-w2", "#c07-w3"].forEach(function (id, i) {
            tl.set(id, id === "#c07-w0" ? { fill: "#d97757" } : { stroke: "#d97757" }, 0.6 + i * 0.06);
          });
          // 0,82: ✓ TV encontrada · 192.168.0.27 (Wi-Fi fica verde)
          tl.fromTo("#c07-l2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, 0.82);
          tl.set("#c07-b1", { opacity: 1, color: "#3dbe5a" }, 0.82);
          tl.set("#c07-dots", { textContent: "" }, 0.82);
          tl.set(["#c07-w1", "#c07-w2", "#c07-w3"], { stroke: "#3dbe5a" }, 0.82);
          tl.set("#c07-w0", { fill: "#3dbe5a" }, 0.82);
          tl.fromTo("#c07-wifi", { scale: 1 }, { scale: 1.12, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 0.82);
          // 0,90: "└ ADB por Wi-Fi · sem root"
          tl.fromTo("#c07-l3", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, 0.9);
          tl.set({}, {}, 1.033333);
          window.__timelines["c07-terminal"] = tl;
        })();
