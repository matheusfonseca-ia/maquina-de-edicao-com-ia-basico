      <script>
        (function () {
          var seed = 1818;
          function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
          function painter(cv) { var g = cv.getContext("2d"); return function (x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }; }

          var BODY = ["..BBBBBBBB..", "..BBBBBBBB..", "..BEBBBBEB..", "BBBEBBBBEBBB", "BBBBBBBBBBBB", "..BBBBBBBB..", "..B.B..B.B..", "..B.B..B.B.."];

          }
          // moeda-token pixel 8×8 (borda #B8862A, "T" no meio)
          var COIN = ["..OOOO..", ".OHYYYO.", "OHDDDDYO", "OYYDDYYO", "OYYDDYYO", "OYYDDYSO", ".OSYYSO.", "..OOOO.."];
          var COINC = { O: "#B8862A", Y: "#E8B547", H: "#F6D27A", D: "#8f6418", S: "#c99a2e" };

            return cv.toDataURL();
          })();
          function coin(host, x, y, size) {
            var d = box(host, x, y, size, size, null, "c18-coin"); d.style.backgroundImage = "url(" + coinURL + ")"; return d;
          }
          function sparkBurst(host, cx, cy, n, t, dist, color) {
            for (var i = 0; i < n; i++) {

          var px = drawNight(document.getElementById("c18-cv"));
          var root = document.getElementById("root");
          var stage = document.getElementById("c18-stage");
          var tl = gsap.timeline({ paused: true });
          var COLORS = ["#4A90D9", "#3DBE5A", "#8A4AD9", "#D94A8C", "#D9B84A", "#4AD9D0"];
          // local = global − 29,6333 · "em" 0,027 · "até" 0,267 · "90%" 0,587

            "-": [".....", ".....", ".....", "XXXXX", ".....", ".....", "....."],
            "9": [".XXX.", "X...X", "X...X", ".XXXX", "....X", "...X.", ".XX.."],
            "0": [".XXX.", "X...X", "X...X", "X...X", "X...X", "X...X", ".XXX."],
            "%": ["XX....X", "XX...X.", "....X..", "...X...", "..X....", ".X...XX", "X....XX"]

          ICONS.pct = GL["%"];
          function pct(host, s, color) { var i = icon("pct", s, color); host.appendChild(i); return i; }
          // aspirador: tanque nas costas do mascote
          var tank = box(stage, 968, 1318, 100, 140, "#4f4b47"); tank.style.border = "6px solid #2a2826"; tank.style.boxSizing = "border-box";
          var win = box(tank, 20, 18, 48, 92, "#2a2826");
          var fill = box(win, 0, 0, 48, 92, "#E8B547"); gsap.set(fill, { scaleY: 0.12, transformOrigin: "50% 100%" });
          // mascote (blocos de 20; pés em y 1600)
          var hero = agent("#D97757", 20);
          hero.el.style.left = "740px"; hero.el.style.top = (1600 - 12 * 20) + "px"; stage.appendChild(hero.el);
          // mangueira + bocal virado pra montanha

          var mouth = box(stage, 708, 1452, 44, 148, null, "c18-vac");
          mouth.style.background = "#5e5a56"; box(mouth, 0, 14, 12, 120, "#2a2826");
          var NX = 718, NY = 1526;
          // montanha de moedas-token (11 fileiras, 66 moedas; sobram 7 = ~10%)
          var CS = 64, rows = [];
          for (var r = 10; r >= 0; r--) {
            var cnt = 11 - r, x0 = 362 - (cnt * 58 + 6) / 2, y = 1536 - r * 46;
            for (var c = 0; c < cnt; c++) {
              var jx = Math.round((rnd() - 0.5) * 8), jy = Math.round((rnd() - 0.5) * 6);
              var el = coin(stage, x0 + c * 58 + jx, y + jy, CS);
              rows.push({ el: el, r: r, c: c, x: x0 + c * 58 + jx + CS / 2, y: y + jy + CS / 2, keep: r === 0 && c >= 2 && c <= 8 });
            }
          }
          // HUD
          var h1 = hud(root, 0, 196, 50); center(h1);
          span(h1, "TOKENS GASTOS", "c18-small");
          var h2 = hud(root, 0, 318, 60); center(h2);
          var oldW = document.createElement("span"); oldW.style.display = "flex"; oldW.style.alignItems = "center"; oldW.style.gap = "6px"; oldW.style.position = "relative"; h2.appendChild(oldW);
          span(oldW, "100", "c18-small"); pct(oldW, 6, "#a39e97");
          var strike = box(oldW, -4, 24, 10, 6, "#ff6b5e"); strike.style.width = "calc(100% + 8px)";
          var arr = icon("arrow", 6, "#d8d2c8"); h2.appendChild(arr);
          var nw = document.createElement("span"); nw.style.display = "flex"; nw.style.alignItems = "center"; nw.style.gap = "6px"; h2.appendChild(nw);
          var num = span(nw, "100", "c18-gold"); pct(nw, 6, "#e8b547");
          gsap.set([oldW, arr], { display: "none" });
          // "em" (0,027): aspirador liga e puxa 90% das moedas (de cima pra baixo)
          var gone = rows.filter(function (o) { return !o.keep; });
          gone.sort(function (a, b) { return b.r - a.r || b.c - a.c; });
          gone.forEach(function (o, i) {
            var t = 0.05 + i * (0.5 / gone.length);
            tl.to(o.el, { x: NX - o.x, y: NY - o.y, scale: 0.3, duration: 0.16, ease: "power2.in" }, t);
            tl.set(o.el, { opacity: 0 }, t + 0.16);
          });
          tl.to(fill, { scaleY: 1, duration: 0.55, ease: "none" }, 0.05);
          // linhas de sucção piscando
          var suck = [];
          [[-40, 44], [0, 70], [40, 44]].forEach(function (q) { var s = box(stage, NX - 24 - q[1], NY + q[0] - 6, q[1], 12, "#f4efe6"); gsap.set(s, { opacity: 0 }); suck.push(s); });
          for (var ts = 0.03; ts < 0.58; ts += 0.08) {
            suck.forEach(function (s, i) { tl.set(s, { opacity: 0.9, x: 0 }, ts + i * 0.02); tl.to(s, { x: 40, opacity: 0, duration: 0.07 }, ts + i * 0.02); });
          }
          for (var tj = 0.03; tj < 0.58; tj += 0.04) tl.set(hero.el, { x: (Math.round(tj / 0.04) % 2) ? -4 : 4 }, tj);
          tl.set(hero.el, { x: 0 }, 0.6);
          // HUD rolando 100% → 10%
          var steps = 18;
          for (var k = 1; k <= steps; k++) tl.set(num, { textContent: String(Math.round(100 - 90 * k / steps)) }, 0.027 + k * (0.54 / steps));
          // "90%" (0,587): letreiro "-90%" piscando, moedas que sobraram pulam
          tl.set([oldW, arr], { display: "flex" }, 0.587);
          tl.to(h2, { scale: 1.12, duration: 0.07 }, 0.587); tl.to(h2, { scale: 1, duration: 0.12 }, 0.657);
          var sign = box(root, 0, 436, 760, 240, null, "c18-sign"); center(sign);
          var bulbs = [[], []];
          for (var bx = 0; bx < 17; bx++) { bulbs[bx % 2].push(box(sign, 12 + bx * 42, 8, 14, 14, "#e8b547")); bulbs[(bx + 1) % 2].push(box(sign, 12 + bx * 42, 194, 14, 14, "#e8b547")); }
          for (var by = 1; by < 5; by++) { bulbs[by % 2].push(box(sign, 8, 8 + by * 38, 14, 14, "#e8b547")); bulbs[(by + 1) % 2].push(box(sign, 714, 8 + by * 38, 14, 14, "#e8b547")); }
          // texto "-90%" em blocos de 20 (25 colunas × 7 linhas = 500 × 140), com sombra
          var word = ["-", "9", "0", "%"], S = 20, txt = document.createElement("div"); txt.style.position = "absolute";
          txt.style.left = (736 - 25 * S) / 2 - 4 + "px"; txt.style.top = (216 - 7 * S) / 2 - 4 + "px"; sign.appendChild(txt);
          var shadowL = layer(txt), faceL = layer(txt); shadowL.style.left = "8px"; shadowL.style.top = "8px";
          var col = 0;

            col += M[0].length + 1;

          for (var tb = 0.587; tb < 1.78; tb += 0.1) {
            var on = Math.round((tb - 0.587) / 0.1) % 2;
            bulbs[0].forEach(function (b) { tl.set(b, { backgroundColor: on ? "#5a4a2a" : "#fff3c4" }, tb); });
            bulbs[1].forEach(function (b) { tl.set(b, { backgroundColor: on ? "#fff3c4" : "#5a4a2a" }, tb); });
          }
          [[0.93, 0.25], [1.03, 1], [1.29, 0.25], [1.39, 1]].forEach(function (q) { tl.set(faceL, { opacity: q[1] }, q[0]); });
          sparkBurst(root, 540, 556, 16, 0.587, 430, "#e8b547");
          var kept = rows.filter(function (o) { return o.keep; });
          [0.6, 0.98].forEach(function (t0) {
            kept.forEach(function (o, i) {
              tl.to(o.el, { y: -60, duration: 0.09, ease: "power2.out" }, t0 + i * 0.02);
              tl.to(o.el, { y: 0, duration: 0.1, ease: "power2.in" }, t0 + 0.09 + i * 0.02);

          var tag = document.createElement("div"); tag.className = "c18-tag"; tag.appendChild(icon("check", 6, "#2a8a3e"));
          span(tag, "SÓ 10"); var tp = icon("pct", 5, "#1a1a1a"); tp.style.marginLeft = "-6px"; tag.appendChild(tp);
          tag.style.top = "1420px"; tag.style.left = "362px"; stage.appendChild(tag); gsap.set(tag, { xPercent: -50 });
          gsap.set(tag, { opacity: 0, scale: 0.6, transformOrigin: "50% 100%" });
          tl.to(tag, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(2)" }, 0.72);
          [0.64, 1.02].forEach(function (t) {
            tl.to(hero.el, { y: -70, duration: 0.09, ease: "power2.out" }, t);
            tl.to(hero.el, { y: 0, duration: 0.1, ease: "power2.in" }, t + 0.09);
          });
          tl.set({}, {}, 1.783333);

        })();
      </script>
    </template>
