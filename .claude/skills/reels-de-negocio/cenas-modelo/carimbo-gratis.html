<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <!-- C06-GRATIS (9,10–10,9833) dividido: "provedores de IA gratuitos" → 6 provedores com "US$ 20" riscado virando "US$ 0" + carimbo GRÁTIS -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "C06 Inter"; src: url("../assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
        @font-face { font-family: "C06 Mono"; src: url("../assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; font-display: block; }

        #root { position: absolute; inset: 0; overflow: hidden; }
        .c06-bg {
          position: absolute; left: 0; top: 0; width: 1080px; height: 770px;
          background-color: #efedeb;
          background-image: linear-gradient(#e6e4e1 2px, transparent 2px), linear-gradient(90deg, #e6e4e1 2px, transparent 2px);
          background-size: 90px 90px; background-position: -1px -1px;
        }
        .c06-card {
          position: absolute; left: 90px; top: 215px; width: 900px; height: 485px;
          border-radius: 28px; background: #f9f8f6; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.1);
        }
        .c06-h1 {
          position: absolute; left: 34px; top: 26px; white-space: nowrap;
          font-family: "C06 Mono", monospace; font-weight: 800; font-size: 30px; line-height: 44px; letter-spacing: 0.08em; color: #1a1a1a;
        }
        .c06-h2 {
          position: absolute; right: 34px; top: 26px; white-space: nowrap;
          font-family: "C06 Mono", monospace; font-weight: 700; font-size: 28px; line-height: 44px; letter-spacing: 0.08em; color: #74716d;
        }
        .c06-chip {
          position: absolute; width: 405px; height: 112px; box-sizing: border-box; border-radius: 20px; background: #ffffff;
          border: 2px solid #ece9e4; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
        }
        .c06-dot { position: absolute; left: 22px; top: 43px; width: 24px; height: 24px; border-radius: 50%; }
        .c06-cn {
          position: absolute; left: 60px; top: 0; height: 108px; white-space: nowrap;
          font-family: "C06 Inter", sans-serif; font-weight: 700; font-size: 32px; line-height: 108px; letter-spacing: -0.02em; color: #1a1a1a;
        }
        .c06-old { position: absolute; right: 22px; top: 31px; height: 46px; white-space: nowrap; }
        .c06-ot { font-family: "C06 Mono", monospace; font-weight: 700; font-size: 30px; line-height: 46px; color: #1a1a1a; }
        .c06-strike { position: absolute; left: -6px; top: 0; width: 124px; height: 46px; overflow: visible; }
        .c06-new {
          position: absolute; right: 18px; top: 28px; height: 52px; padding: 0 12px; border-radius: 10px; background: #dcf1e2; white-space: nowrap;
          font-family: "C06 Mono", monospace; font-weight: 800; font-size: 32px; line-height: 52px; color: #1a7f37;
        }
        .c06-srow { position: absolute; left: 0; top: 0; width: 900px; height: 485px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .c06-stamp {
          height: 156px; padding: 0 40px; box-sizing: border-box; border: 10px solid #2da44e; border-radius: 20px;
          background: rgba(255, 255, 255, 0.94); white-space: nowrap; opacity: 0;
          font-family: "C06 Inter", sans-serif; font-weight: 900; font-size: 112px; line-height: 136px; letter-spacing: -0.01em; color: #2da44e;
        }
      </style>
      <div data-hf-id="hf-z102" id="root" data-composition-id="c06-gratis" data-width="1080" data-height="1920" data-duration="1.883333">
        <div data-hf-id="hf-h86r" class="c06-bg"></div>
        <div data-hf-id="hf-c6r2" class="c06-card" id="c06-card">
          <div data-hf-id="hf-rc2b" class="c06-h1">PROVEDORES DE IA</div>
          <div data-hf-id="hf-g676" class="c06-h2">PREÇO / MÊS</div>
          <div data-hf-id="hf-vuwg" id="c06-chips"></div>
          <div data-hf-id="hf-0kk7" class="c06-srow"><div data-hf-id="hf-tptc" class="c06-stamp" id="c06-stamp" data-layout-allow-overlap="">GRÁTIS</div></div>
        </div>
      </div>
      <script>
        (function () {
          var PROV = [["NVIDIA NIM", "#76b900"], ["OpenRouter", "#6467f2"], ["Groq", "#f55036"], ["Gemini", "#8a4ad9"], ["DeepSeek", "#3dbe5a"], ["Mistral", "#fa7a1f"]];
          var host = document.getElementById("c06-chips"), items = [];
          PROV.forEach(function (p, i) {
            var x = i % 2 === 0 ? 30 : 465, y = 92 + Math.floor(i / 2) * 128;
            var d = document.createElement("div"); d.className = "c06-chip"; d.style.left = x + "px"; d.style.top = y + "px";
            d.innerHTML =
              '<span class="c06-dot" style="background:' + p[1] + '"></span>' +
              '<span class="c06-cn">' + p[0] + '</span>' +
              '<span class="c06-old" data-layout-allow-occlusion=""><span class="c06-ot" data-layout-allow-occlusion="">US$ 20</span>' +
              '<svg class="c06-strike" viewBox="0 0 124 46"><path d="M2 30 L122 16" fill="none" stroke="#c8102e" stroke-width="7" stroke-linecap="round" /></svg></span>' +
              '<span class="c06-new" data-layout-allow-overlap="">US$ 0</span>';
            host.appendChild(d);
            items.push({ d: d, dot: d.querySelector(".c06-dot"), old: d.querySelector(".c06-old"), path: d.querySelector("path"), nw: d.querySelector(".c06-new") });
          });

          var L = 130;
          var tl = gsap.timeline({ paused: true });
          // quadro 0: 6 provedores com preço US$ 20, nada riscado
          items.forEach(function (it) {
            it.path.setAttribute("stroke-dasharray", L);
            gsap.set(it.path, { attr: { "stroke-dashoffset": L } });
            gsap.set(it.nw, { opacity: 0 });
          });
          gsap.set("#c06-stamp", { rotation: -10 });

          // 9,20 → 9,90 (0,10 → 0,70): cada preço é riscado em vermelho e vira US$ 0 verde
          items.forEach(function (it, i) {
            var t = 0.1 + i * 0.12;
            tl.to(it.path, { attr: { "stroke-dashoffset": 0 }, duration: 0.09, ease: "power1.inOut" }, t);
            tl.to(it.old, { opacity: 0, y: -14, duration: 0.08, ease: "power1.in" }, t + 0.15);
            tl.fromTo(it.nw, { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(2)", transformOrigin: "100% 50%", immediateRender: false }, t + 0.17);
          });
          // "IA" (0,74): bolinhas dos provedores pulsam em onda
          items.forEach(function (it, i) {
            tl.fromTo(it.dot, { scale: 1 }, { scale: 1.5, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 0.74 + i * 0.03);
          });
          // "gratuitos" (1,14): carimbo GRÁTIS bate no centro
          tl.set("#c06-stamp", { opacity: 1 }, 1.14);
          tl.fromTo("#c06-stamp", { scale: 1.6, rotation: -15 }, { scale: 1, rotation: -10, duration: 0.14, ease: "power3.in", immediateRender: false }, 1.14);
          tl.fromTo("#c06-card", { x: 0 }, { x: 8, duration: 0.03, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, 1.28);
          // 1,50: valores US$ 0 dão um pulinho em onda
          items.forEach(function (it, i) {
            tl.to(it.nw, { y: -10, duration: 0.06, ease: "power2.out" }, 1.5 + i * 0.03);
            tl.to(it.nw, { y: 0, duration: 0.07, ease: "power2.in" }, 1.56 + i * 0.03);
          });
          tl.set({}, {}, 1.883333);
          window.__timelines["c06-gratis"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
